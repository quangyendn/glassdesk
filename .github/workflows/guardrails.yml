name: Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardrails:
    name: Secrets + sensitive-info scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks scan (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          gitleaks detect --redact -v --config=.gitleaks.toml \
            --log-opts="origin/${{ github.base_ref }}..HEAD"

      - name: gitleaks scan (push commits)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            gitleaks detect --redact -v --config=.gitleaks.toml \
              --log-opts="${{ github.event.before }}..${{ github.sha }}"
          else
            gitleaks detect --redact -v --config=.gitleaks.toml --log-opts="-1"
          fi

      - name: Node scanner over changed files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD")
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No changed files."
            exit 0
          fi
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED[@]}"
          node scripts/guardrails/scan-personal-info.js --files "${CHANGED[@]}"

      - name: Run guardrails unit tests
        run: npm test
