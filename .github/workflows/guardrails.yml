name: Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardrails:
    name: Secrets + sensitive-info scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks scan (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Fetch base ref with full history (no --depth=1). With a shallow
          # base, `origin/<base>..HEAD` includes every ancestor of HEAD that
          # isn't the single tip commit, so commits already on main get
          # rescanned. A deep fetch keeps the range tight to the real PR diff.
          git fetch --no-tags origin "${{ github.base_ref }}"
          gitleaks detect --redact -v --config=.gitleaks.toml \
            --log-opts="origin/${{ github.base_ref }}..HEAD"

      - name: gitleaks scan (push commits)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            gitleaks detect --redact -v --config=.gitleaks.toml \
              --log-opts="${{ github.event.before }}..${{ github.sha }}"
          else
            gitleaks detect --redact -v --config=.gitleaks.toml --log-opts="-1"
          fi

      - name: Node scanner over changed files (PR)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD")
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No changed files."
            exit 0
          fi
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED[@]}"
          node scripts/guardrails/scan-personal-info.js --files "${CHANGED[@]}"

      - name: Node scanner over changed files (push)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch / first push: scan files touched by the last commit only.
            mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only \
              --diff-filter=ACMR -r "${{ github.sha }}")
          else
            mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMR \
              "$BEFORE...${{ github.sha }}")
          fi
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No changed files."
            exit 0
          fi
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED[@]}"
          node scripts/guardrails/scan-personal-info.js --files "${CHANGED[@]}"

      - name: Run guardrails unit tests
        run: npm test
